[project]
name = "enterprise-operations-assistant"
version = "0.1.0"
description = "A learning project demonstrating MCP, Groq tool calling, and simulated enterprise systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.30.0",
    "mcp>=1.28,<2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]